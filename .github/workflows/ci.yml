name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create mock local.properties and google-services.json for CI
        run: |
          echo "TFL_API_KEY=mock_ci_key" >> local.properties
          echo "NATIONAL_RAIL_API_KEY=mock_ci_key" >> local.properties
          echo "BODS_API_KEY=mock_ci_key" >> local.properties
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"ci-test","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.androidfung.departureboard"}},"oauth_client":[],"api_key":[{"current_key":"mock"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify R8 Minified Release Build
        run: ./gradlew assembleRelease --stacktrace
